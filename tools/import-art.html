<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Import creature art</title>
<style>
body{font:16px system-ui,sans-serif;background:#0c141b;color:#e8eef3;margin:0;padding:18px;max-width:760px}
h1{font-size:20px;margin:0 0 6px} p{color:#9fb0bf;margin:4px 0 14px}
#drop{border:2px dashed #3b5163;border-radius:12px;padding:26px;text-align:center;cursor:pointer}
#drop.on{border-color:#ffd23a;background:#16222c}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:14px 0}
label{display:flex;gap:6px;align-items:center} input[type=text]{background:#16222c;color:#e8eef3;border:1px solid #3b5163;border-radius:6px;padding:6px 8px;width:150px}
.card{display:flex;gap:14px;align-items:center;background:#16222c;border-radius:12px;padding:12px;margin:10px 0}
canvas{image-rendering:pixelated;width:144px;height:144px;background:repeating-conic-gradient(#2a3a48 0 25%,#1e2c38 0 50%) 0 0/16px 16px;border-radius:8px}
button{background:#ffd23a;border:0;border-radius:8px;padding:9px 14px;font-weight:700;cursor:pointer}
small{color:#9fb0bf}
</style></head><body>
<h1>Import creature art</h1>
<p>Any picture → background removed, cropped, 48 × 48, palette-snapped, navy outline. Name the file after the creature id (e.g. <b>badgerCub.png</b>), or type the id. Save the result into <b>assets/creatures/</b>: the game uses it by itself.</p>
<div id="drop">Drop pictures here, or tap to choose<input id="file" type="file" accept="image/*" multiple hidden></div>
<div class="row">
  <label>Background tolerance <input id="tol" type="range" min="5" max="120" value="42"><b id="tolv">42</b></label>
  <label>Background colour <input id="bg" type="text" placeholder="auto (edge colour), or #ffffff"></label>
  <label><input id="snap" type="checkbox" checked> palette</label><label><input id="outline" type="checkbox" checked> outline</label><label><input id="flip" type="checkbox"> mirror</label><label><input id="nobg" type="checkbox"> keep existing transparency</label>
</div>
<div id="out"></div>
<script src="../engine/sprites.js"></script><script src="art-core.js"></script>
<script>
const $ = s => document.querySelector(s), items = [];
const opts = () => ({ tol: +$('#tol').value, bg: $('#bg').value.trim() || undefined, snap: $('#snap').checked, outline: $('#outline').checked, flip: $('#flip').checked, noBg: $('#nobg').checked });
function render() {
  $('#out').innerHTML = ''; $('#tolv').textContent = $('#tol').value;
  items.forEach((it, i) => {
    const card = document.createElement('div'); card.className = 'card'; let cv = null, info = '';
    try { cv = ArtCore.process(it.img, opts()); info = cv.__info; } catch (e) { info = e.message; }
    const left = document.createElement(cv ? 'div' : 'span'); if (cv) left.appendChild(cv); card.appendChild(left);
    const right = document.createElement('div'); right.innerHTML = '<div>id <input type="text" value="' + it.id + '"></div><small>' + info + '</small><br><button>Download ' + it.id + '.png</button>';
    right.querySelector('input').oninput = e => { it.id = e.target.value.trim(); right.querySelector('button').textContent = 'Download ' + it.id + '.png'; };
    right.querySelector('button').onclick = () => { if (!cv) return; const a = document.createElement('a'); a.href = cv.toDataURL('image/png'); a.download = it.id + '.png'; a.click(); };
    card.appendChild(right); $('#out').appendChild(card);
  });
}
function add(files) { for (const f of files) { const img = new Image(); img.onload = () => { items.push({ img, id: f.name.replace(/\.[^.]+$/, '') }); render(); }; img.src = URL.createObjectURL(f); } }
$('#drop').onclick = () => $('#file').click(); $('#file').onchange = e => add(e.target.files);
$('#drop').ondragover = e => { e.preventDefault(); $('#drop').classList.add('on'); }; $('#drop').ondragleave = () => $('#drop').classList.remove('on');
$('#drop').ondrop = e => { e.preventDefault(); $('#drop').classList.remove('on'); add(e.dataTransfer.files); };
for (const s of ['#tol', '#bg', '#snap', '#outline', '#flip', '#nobg']) $(s).addEventListener('input', render);
</script></body></html>
